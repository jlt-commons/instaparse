name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install jolt
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y liblz4-1 zlib1g libtinfo6
          # NEEDS JOLT > v0.6.8. The suite leans on jolt-lang/jolt#567: a deftype
          # declaring a collection interface prints in that collection's shape
          # (AutoFlattenSeq as a seq, FlattenOnDemandVector as a vector) and
          # StringBuilder is a CharSequence. Against v0.6.8 that is 10 print-test
          # failures and one "count not supported on this type: :object"; against
          # main it is 9422 assertions, 0 failures. This goes green on the next
          # release with no change here.
          #
          # Install through jolt's own install script rather than resolving the
          # release asset here: it owns the archive and binary naming (which
          # changed in v0.5.0, when the CLI was renamed from joltc to jolt) and
          # verifies the checksum.
          curl -fsSL https://raw.githubusercontent.com/jolt-lang/jolt/main/install \
            | bash -s -- --dir "$HOME/.jolt"
          echo "$HOME/.jolt" >> "$GITHUB_PATH"
      # The :jolt alias runs the cognitect test-runner over an explicit :nses
      # list — instaparse's tests are .cljc, which the runner's *_test.clj scan
      # does not discover. "test" is on that alias's :extra-paths so abnf_test's
      # io/resource lookups find test/data/*.txt.
      - name: Test
        run: JOLT_PWD="$PWD" jolt -X:jolt
